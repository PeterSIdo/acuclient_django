{% extends 'clients/base.html' %}
{% block content %}
<h2>Clients</h2>
<form method="get" class="form-inline mb-3">
    <input type="text" name="search" placeholder="Search..." value="{{ search_query }}" class="form-control mr-2">
    <button type="submit" class="btn btn-secondary">Search</button>
</form>
<a href="{% url 'add_client' %}" class="btn btn-success mb-3">Add New Client</a>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Condition</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for client in clients %}
        <tr>
            <td>{{ client.name }}</td>
            <td>{{ client.condition }}</td>
            <td>
                <a href="{% url 'view_client' client_id=client.id %}" class="btn btn-info btn-sm">View</a>
                <a href="{% url 'edit_client' client_id=client.id %}" class="btn btn-warning btn-sm">Edit</a>
                <form action="{% url 'delete_client' client_id=client.id %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No clients found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
